services:
  - type: web
    name: animal-vision-ai-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_PATH
        value: models/best.pt
      - key: CONFIDENCE_THRESHOLD
        value: "0.25"
      - key: MAX_FILE_SIZE_MB
        value: "4"
      - key: ALLOWED_ORIGINS
        value: "*"
